<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay Phát Biểu</title>

    <style>
        /* ================================
   VÒNG QUAY RANDOM - BLUE CREAM
   ================================ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
    color: #0758b3;

    background:
        radial-gradient(circle at 7% 8%,
            rgba(112, 145, 180, 0.9) 0 85px,
            transparent 86px),

        radial-gradient(circle at 93% 90%,
            rgba(112, 145, 180, 0.9) 0 100px,
            transparent 101px),

        radial-gradient(circle at 90% 12%,
            rgba(112, 145, 180, 0.55) 0 35px,
            transparent 36px),

        #fbf5eb;

    overflow-x: hidden;

    position: relative;
}


/* ================================
   DECORATION NỀN
   ================================ */

body::before {
    content: "";
    position: fixed;
    width: 180px;
    height: 180px;

    top: -65px;
    left: -45px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,0.35) 2px,
            transparent 3px
        );

    background-size: 18px 18px;

    opacity: 0.8;
    pointer-events: none;
}


body::after {
    content: "";
    position: fixed;

    width: 210px;
    height: 210px;

    right: -80px;
    bottom: -75px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,0.3) 2px,
            transparent 3px
        );

    background-size: 18px 18px;

    opacity: 0.8;
    pointer-events: none;
}


/* ================================
   KHUNG CHÍNH
   ================================ */

.wheel-section {
    width: min(1200px, 94%);
    margin: 0 auto;

    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 35px 20px 50px;
}


/* ================================
   TIÊU ĐỀ
   ================================ */

h1 {
    margin: 5px 0 25px;

    color: #0758b3;

    font-size: clamp(32px, 5vw, 58px);

    font-weight: 800;

    letter-spacing: 2px;

    text-align: center;

    text-transform: uppercase;

    text-shadow:
        2px 2px 0 #ffffff,
        0 5px 12px rgba(62, 105, 145, 0.15);
}


/* ================================
   VÒNG QUAY
   ================================ */

.wheel-container {
    position: relative;

    width: min(680px, 88vw);
    aspect-ratio: 1 / 1;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 10px auto 30px;

    filter:
        drop-shadow(0 18px 20px rgba(66, 94, 125, 0.18));
}


/* Canvas */

#wheel {
    display: block;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    border: 10px solid #6f91b3;

    background: #ffffff;

    box-shadow:
        0 0 0 5px #d7e4ef,
        0 0 0 9px #ffffff,
        inset 0 0 20px rgba(50, 80, 110, 0.15);

    cursor: default;
}


/* ================================
   MŨI TÊN
   ================================ */

.wheel-container .pointer {
    position: absolute;

    z-index: 10;

    top: -3px;
    left: 50%;

    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 22px solid transparent;
    border-right: 22px solid transparent;

    border-top: 45px solid #0758b3;

    filter:
        drop-shadow(0 4px 3px rgba(40, 70, 100, 0.25));
}


/* Viền trắng bên trong mũi tên */

.wheel-container .pointer::before {
    content: "";

    position: absolute;

    left: -14px;
    top: -43px;

    width: 0;
    height: 0;

    border-left: 14px solid transparent;
    border-right: 14px solid transparent;

    border-top: 28px solid #ffffff;
}


/* ================================
   NÚT QUAY
   ================================ */

#spinBtn {
    appearance: none;
    border: none;
    outline: none;

    display: block;

    margin: 0 auto;

    padding: 17px 55px;

    min-width: 230px;

    border-radius: 50px;

    background: #6f91b3;

    color: #ffffff;

    font-family: inherit;

    font-size: 22px;
    font-weight: 800;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 6px 0 #527493,
        0 12px 20px rgba(70, 100, 130, 0.22);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.2s ease;
}


/* Hover */

#spinBtn:hover {
    background: #5e83a7;

    transform: translateY(-2px);

    box-shadow:
        0 8px 0 #527493,
        0 15px 22px rgba(70, 100, 130, 0.25);
}


/* Khi nhấn */

#spinBtn:active {
    transform: translateY(5px);

    box-shadow:
        0 2px 0 #527493,
        0 5px 10px rgba(70, 100, 130, 0.18);
}


/* Khi đang quay */

#spinBtn:disabled {
    opacity: 0.65;

    cursor: not-allowed;

    transform: none;

    box-shadow:
        0 4px 0 #527493,
        0 8px 15px rgba(70, 100, 130, 0.15);
}


/* ================================
   KẾT QUẢ
   ================================ */

#result {
    width: min(500px, 85vw);

    min-height: 58px;

    margin: 22px auto 0;

    padding: 14px 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    border-radius: 30px;

    border: 2px solid #9db9d3;

    background: rgba(255, 255, 255, 0.72);

    color: #5d84a8;

    font-size: 20px;
    font-weight: 700;

    box-shadow:
        0 5px 15px rgba(80, 110, 140, 0.1);
}


/* Tên người trúng */

#result strong {
    color: #0758b3;

    margin-left: 5px;
}


/* ================================
   TRANG TRÍ VÒNG QUAY
   ================================ */

.wheel-section::before {
    content: "✦";

    position: fixed;

    top: 80px;
    left: 7%;

    color: #6f91b3;

    font-size: 35px;

    opacity: 0.8;

    pointer-events: none;
}

.wheel-section::after {
    content: "✦";

    position: fixed;

    top: 90px;
    right: 8%;

    color: #6f91b3;

    font-size: 28px;

    opacity: 0.7;

    pointer-events: none;
}


/* ================================
   MOBILE
   ================================ */

@media (max-width: 700px) {

    .wheel-section {
        width: 100%;
        padding: 25px 12px 35px;
    }

    h1 {
        font-size: 32px;

        letter-spacing: 1px;

        margin-bottom: 15px;
    }

    .wheel-container {
        width: min(94vw, 560px);

        margin-bottom: 25px;
    }

    #wheel {
        border-width: 7px;

        box-shadow:
            0 0 0 3px #d7e4ef,
            0 0 0 6px #ffffff;
    }

    .wheel-container .pointer {
        border-left-width: 16px;
        border-right-width: 16px;
        border-top-width: 34px;
    }

    #spinBtn {
        min-width: 190px;

        padding: 14px 40px;

        font-size: 19px;
    }

    #result {
        width: 90%;

        font-size: 17px;
    }
}


/* ================================
   MÀN HÌNH RẤT NHỎ
   ================================ */

@media (max-width: 420px) {

    h1 {
        font-size: 27px;
    }

    .wheel-container {
        width: 94vw;
    }

    #spinBtn {
        min-width: 170px;

        padding: 13px 30px;

        font-size: 18px;
    }

    #result {
        font-size: 15px;

        min-height: 50px;
    }
}
    </style>
</head>

<body>

    <h1> Vòng Quay Phát Biểu Bài Tiếng Anh</h1>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="500" height="500"></canvas>
    </div>

    <button id="spinBtn">QUAY!</button>

    <div id="result"></div>

    <script>
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spinBtn");
        const result = document.getElementById("result");

        const items = [
            "Nguyễn Ngọc Tâm Anh",
            "Trương Ngọc Ánh",
            "Phùng Minh Diệp",
            "Vũ Thùy Dương",
            "Đặng Cao Hiếu",
            "Nguyễn Thị Mỹ Hạnh",
            "Phạm Thị Thu Hiền",
            "Lê Thị Hoài",
            "Nguyễn Mạnh Hoàng",
            "Chu Khắc Khiêm",
            "Phạm Văn Khoa",
            "Nguyễn Văn Lâm",
            "Hoàng Hà Linh",
            "Vũ Bảo Linh",
            "Bùi Mai Linh",
            "Nguyễn Thùy Linh",
            "Nguyễn Khánh Linh",
            "Võ Thị Lưu",
            "Lê Thị Cẩm Ly",
            "Mai Khánh Ly",
            "Lê Thị Phương Mai",
            "Đỗ Tuệ Minh",
            "Vũ Trà My",
            "Lại Thị Hà My",
            "Đồng Thị Thanh Ngân",
            "Bùi Thảo Nguyên",
            "Lê Thị Phương",
            "Nguyễn Thị Như Quỳnh",
            "Phan Hoàng Bảo Sơn",
            "Vũ Thị Kiều Thanh",
            "Bùi Thị Anh Thơ",
            "Nguyễn Thanh Thúy",
            "Phạm Thùy Trang",
            "Nguyễn Thu Trang",
            "Lê Phan Hà Trang",
            "Lê Bảo Trân",
            "Phùng Hải Yến",
            "Nguyễn Minh Tuệ",
            "Dương Thị Hải Yến"
        ];

        const colors = [
            "#ff9fbc",
            "#c7a4ff",
            "#ffd28f",
            "#9de2d0",
            "#9ed8ff",
            "#ffb3c6",
            "#b9a7ff",
            "#ffe29a"
        ];

        const center = canvas.width / 2;
        const radius = canvas.width / 2;

        let currentRotation = 0;
        let spinning = false;

        const sliceAngle = (Math.PI * 2) / items.length;


        /* =========================
           VẼ VÒNG QUAY
        ========================= */

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            items.forEach((item, index) => {

                const startAngle = index * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Ô màu
                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(
                    center,
                    center,
                    radius,
                    startAngle,
                    endAngle
                );
                ctx.closePath();

                ctx.fillStyle = colors[index % colors.length];
                ctx.fill();

                // Viền
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.stroke();


                /* =========================
                   TÊN NGƯỜI
                ========================= */

                const middleAngle = startAngle + sliceAngle / 2;

                ctx.save();

                ctx.translate(center, center);
                ctx.rotate(middleAngle);

                ctx.textAlign = "right";
                ctx.textBaseline = "middle";

                // 41 người nên chữ phải nhỏ
                let fontSize = 18;

                if (items.length > 35) {
                    fontSize = 15;
                }

                if (items.length > 40) {
                    fontSize = 13;
                }

                ctx.font = `bold ${fontSize}px Arial`;
                ctx.fillStyle = "#ffffff";

                // Có bóng chữ để dễ đọc
                ctx.shadowColor = "rgba(80,40,80,0.35)";
                ctx.shadowBlur = 3;

                ctx.fillText(
                    item,
                    radius - 18,
                    0
                );

                ctx.restore();
            });

            // Tâm vòng quay
            ctx.beginPath();
            ctx.arc(center, center, 28, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(center, center, 20, 0, Math.PI * 2);
            ctx.fillStyle = "#ffe5ec";
            ctx.fill();
        }


        /* =========================
           QUAY ĐÚNG TÊN ĐƯỢC CHỌN
        ========================= */

        function spinWheel() {

            if (spinning) return;

            spinning = true;
            spinBtn.disabled = true;
            result.textContent = "";

            // Chọn người thắng
            const winner = Math.floor(Math.random() * items.length);

            // Góc chính giữa ô người thắng
            const winnerMiddleAngle =
                winner * sliceAngle + sliceAngle / 2;

            // Mũi tên nằm phía trên
            const pointerAngle = -Math.PI / 2;

            /*
                Góc cuối cần đạt để người thắng
                nằm chính xác dưới mũi tên
            */
            const finalAngle =
                pointerAngle - winnerMiddleAngle;

            /*
                Chuẩn hóa góc hiện tại
                để tránh số góc quá lớn sau nhiều lần quay
            */
            const normalizedCurrent =
                currentRotation % (Math.PI * 2);

            /*
                Khoảng cách từ vị trí hiện tại
                đến vị trí người thắng
            */
            let difference =
                finalAngle - normalizedCurrent;

            if (difference < 0) {
                difference += Math.PI * 2;
            }

            /*
                Luôn thêm 6 vòng quay
                => tốc độ các lần quay ổn định
            */
            const extraSpins = 6 * Math.PI * 2;

            const startRotation = currentRotation;

            const targetRotation =
                currentRotation +
                extraSpins +
                difference;

            // Luôn mất đúng 3 giây
            const duration = 3000;

            const startTime = performance.now();


            function animate(currentTime) {

                const elapsed =
                    currentTime - startTime;

                let progress =
                    elapsed / duration;

                if (progress > 1) {
                    progress = 1;
                }

                /*
                    Ease out:
                    đầu quay nhanh
                    cuối chậm lại
                */
                const easeOut =
                    1 - Math.pow(1 - progress, 4);

                currentRotation =
                    startRotation +
                    (targetRotation - startRotation) *
                    easeOut;


                /*
                    Vẽ vòng quay
                */
                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                ctx.save();

                ctx.translate(center, center);
                ctx.rotate(currentRotation);
                ctx.translate(-center, -center);

                drawWheel();

                ctx.restore();


                if (progress < 1) {

                    requestAnimationFrame(animate);

                } else {

                    // Đảm bảo góc cuối chính xác tuyệt đối
                    currentRotation = targetRotation;

                    spinning = false;
                    spinBtn.disabled = false;

                }
            }

            requestAnimationFrame(animate);
        }


        /* =========================
           KHỞI TẠO
        ========================= */

        drawWheel();

        spinBtn.addEventListener(
            "click",
            spinWheel
        );
    </script>

</body>

</html>
