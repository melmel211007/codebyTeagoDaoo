<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay Phát Biểu</title>

    <style>
        /* ========================================
   RANDOM WHEEL
   STYLE: CREAM × DUSTY BLUE × ROYAL BLUE
======================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;

    font-family:
        "Arial Rounded MT Bold",
        "Trebuchet MS",
        Arial,
        sans-serif;

    color: #0757a8;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 38px 20px 45px;

    overflow-x: hidden;

    /* nền chính */
    background:
        radial-gradient(
            circle at 7% 8%,
            rgba(111, 145, 178, 0.85) 0 85px,
            transparent 86px
        ),
        radial-gradient(
            circle at 94% 91%,
            rgba(111, 145, 178, 0.82) 0 105px,
            transparent 106px
        ),
        #fbf5eb;
}


/* ========================================
   DECORATION NHẸ Ở 4 GÓC
======================================== */

body::before {
    content: "";

    position: fixed;

    width: 190px;
    height: 190px;

    top: -75px;
    left: -55px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.5) 0 3px,
            transparent 3.5px
        );

    background-size: 19px 19px;

    opacity: .7;

    pointer-events: none;
}

body::after {
    content: "";

    position: fixed;

    width: 200px;
    height: 200px;

    right: -65px;
    bottom: -65px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.45) 0 3px,
            transparent 3.5px
        );

    background-size: 19px 19px;

    opacity: .7;

    pointer-events: none;
}


/* ========================================
   TITLE
======================================== */

h1 {
    position: relative;
    z-index: 2;

    margin: 0 0 30px;

    color: #0757a8;

    font-size: clamp(34px, 5vw, 58px);

    font-weight: 800;

    letter-spacing: 2px;

    text-align: center;

    text-transform: uppercase;

    line-height: 1.05;
}


/* đường trang trí dưới title */

h1::after {
    content: "";

    display: block;

    width: 95px;
    height: 4px;

    margin: 14px auto 0;

    border-radius: 20px;

    background: #86a8c7;

    box-shadow:
        25px 0 0 #c4d4e3,
        -25px 0 0 #c4d4e3;
}


/* ========================================
   WHEEL CONTAINER
======================================== */

.wheel-container {
    position: relative;

    z-index: 2;

    width: min(680px, 88vw);
    aspect-ratio: 1 / 1;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 30px;

    filter:
        drop-shadow(
            0 18px 25px rgba(64, 94, 125, .16)
        );
}


/* ========================================
   CANVAS
======================================== */

#wheel {
    display: block;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    /* vòng ngoài */
    border: 10px solid #6f91b3;

    background: #fffdf8;

    box-shadow:
        0 0 0 4px #dce7f0,
        0 0 0 8px #ffffff,
        inset 0 0 25px rgba(67, 98, 128, .12);
}


/* ========================================
   POINTER
======================================== */

.wheel-container .pointer {
    position: absolute;

    z-index: 20;

    top: -8px;
    left: 50%;

    transform: translateX(-50%);

    width: 0;
    height: 0;

    border-left: 21px solid transparent;
    border-right: 21px solid transparent;

    border-top: 43px solid #0757a8;

    filter:
        drop-shadow(
            0 4px 3px rgba(38, 66, 94, .25)
        );
}


/* ========================================
   NÚT QUAY
======================================== */

#spinBtn {
    position: relative;
    z-index: 3;

    border: none;
    outline: none;

    min-width: 235px;

    padding: 16px 48px;

    border-radius: 50px;

    background: #7195b8;

    color: white;

    font-family: inherit;

    font-size: 21px;

    font-weight: 800;

    letter-spacing: 1px;

    cursor: pointer;

    box-shadow:
        0 5px 0 #527695,
        0 10px 20px rgba(70, 100, 130, .18);

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}

#spinBtn:hover {
    background: #6389ae;

    transform: translateY(-3px);

    box-shadow:
        0 8px 0 #527695,
        0 14px 24px rgba(70, 100, 130, .22);
}

#spinBtn:active {
    transform: translateY(4px);

    box-shadow:
        0 2px 0 #527695,
        0 5px 10px rgba(70, 100, 130, .15);
}

#spinBtn:disabled {
    opacity: .6;

    cursor: not-allowed;

    transform: none;
}


/* ========================================
   KẾT QUẢ
======================================== */

#result {
    position: relative;
    z-index: 3;

    width: min(520px, 88vw);

    min-height: 58px;

    margin-top: 22px;

    padding: 13px 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 2px solid #aec5da;

    border-radius: 40px;

    background: rgba(255, 253, 248, .88);

    color: #7195b8;

    font-size: 19px;

    font-weight: 700;

    text-align: center;

    box-shadow:
        0 5px 18px rgba(76, 105, 135, .08);
}

#result strong {
    color: #0757a8;

    margin-left: 6px;
}


/* ========================================
   DECORATIVE CIRCLES
   tạo bằng box-shadow
======================================== */

body {
    --blue: #7195b8;
    --light-blue: #b9cee0;
}


/* ========================================
   TABLET
======================================== */

@media (max-width: 700px) {

    body {
        padding: 25px 12px 35px;
    }

    h1 {
        font-size: 34px;

        margin-bottom: 22px;
    }

    h1::after {
        width: 70px;
    }

    .wheel-container {
        width: 94vw;

        margin-bottom: 24px;
    }

    #wheel {
        border-width: 7px;

        box-shadow:
            0 0 0 3px #dce7f0,
            0 0 0 6px #ffffff;
    }

    .wheel-container .pointer {
        border-left-width: 16px;
        border-right-width: 16px;
        border-top-width: 34px;
    }

    #spinBtn {
        min-width: 200px;

        padding: 14px 38px;

        font-size: 19px;
    }

    #result {
        font-size: 17px;
    }
}


/* ========================================
   PHONE
======================================== */

@media (max-width: 430px) {

    body {
        padding-top: 20px;
    }

    h1 {
        font-size: 27px;

        letter-spacing: 1px;

        margin-bottom: 18px;
    }

    .wheel-container {
        width: 95vw;
    }

    #spinBtn {
        min-width: 180px;

        padding: 13px 30px;

        font-size: 18px;
    }

    #result {
        min-height: 52px;

        padding: 10px 18px;

        font-size: 15px;
    }
}
    </style>
</head>

<body>

    <h1> Vòng Quay Phát Biểu Bài Tiếng Anh</h1>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="500" height="500"></canvas>
    </div>

    <button id="spinBtn">QUAY!</button>

    <div id="result"></div>

    <script>
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spinBtn");
        const result = document.getElementById("result");

        const items = [
            "Nguyễn Ngọc Tâm Anh",
            "Trương Ngọc Ánh",
            "Phùng Minh Diệp",
            "Vũ Thùy Dương",
            "Đặng Cao Hiếu",
            "Nguyễn Thị Mỹ Hạnh",
            "Phạm Thị Thu Hiền",
            "Lê Thị Hoài",
            "Nguyễn Mạnh Hoàng",
            "Chu Khắc Khiêm",
            "Phạm Văn Khoa",
            "Nguyễn Văn Lâm",
            "Hoàng Hà Linh",
            "Vũ Bảo Linh",
            "Bùi Mai Linh",
            "Nguyễn Thùy Linh",
            "Nguyễn Khánh Linh",
            "Võ Thị Lưu",
            "Lê Thị Cẩm Ly",
            "Mai Khánh Ly",
            "Lê Thị Phương Mai",
            "Đỗ Tuệ Minh",
            "Vũ Trà My",
            "Lại Thị Hà My",
            "Đồng Thị Thanh Ngân",
            "Bùi Thảo Nguyên",
            "Lê Thị Phương",
            "Nguyễn Thị Như Quỳnh",
            "Phan Hoàng Bảo Sơn",
            "Vũ Thị Kiều Thanh",
            "Bùi Thị Anh Thơ",
            "Nguyễn Thanh Thúy",
            "Phạm Thùy Trang",
            "Nguyễn Thu Trang",
            "Lê Phan Hà Trang",
            "Lê Bảo Trân",
            "Phùng Hải Yến",
            "Nguyễn Minh Tuệ",
            "Dương Thị Hải Yến"
        ];

        const colors = [
            "#ff9fbc",
            "#c7a4ff",
            "#ffd28f",
            "#9de2d0",
            "#9ed8ff",
            "#ffb3c6",
            "#b9a7ff",
            "#ffe29a"
        ];

        const center = canvas.width / 2;
        const radius = canvas.width / 2;

        let currentRotation = 0;
        let spinning = false;

        const sliceAngle = (Math.PI * 2) / items.length;


        /* =========================
           VẼ VÒNG QUAY
        ========================= */

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            items.forEach((item, index) => {

                const startAngle = index * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Ô màu
                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(
                    center,
                    center,
                    radius,
                    startAngle,
                    endAngle
                );
                ctx.closePath();

                ctx.fillStyle = colors[index % colors.length];
                ctx.fill();

                // Viền
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.stroke();


                /* =========================
                   TÊN NGƯỜI
                ========================= */

                const middleAngle = startAngle + sliceAngle / 2;

                ctx.save();

                ctx.translate(center, center);
                ctx.rotate(middleAngle);

                ctx.textAlign = "right";
                ctx.textBaseline = "middle";

                // 41 người nên chữ phải nhỏ
                let fontSize = 18;

                if (items.length > 35) {
                    fontSize = 15;
                }

                if (items.length > 40) {
                    fontSize = 13;
                }

                ctx.font = `bold ${fontSize}px Arial`;
                ctx.fillStyle = "#ffffff";

                // Có bóng chữ để dễ đọc
                ctx.shadowColor = "rgba(80,40,80,0.35)";
                ctx.shadowBlur = 3;

                ctx.fillText(
                    item,
                    radius - 18,
                    0
                );

                ctx.restore();
            });

            // Tâm vòng quay
            ctx.beginPath();
            ctx.arc(center, center, 28, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(center, center, 20, 0, Math.PI * 2);
            ctx.fillStyle = "#ffe5ec";
            ctx.fill();
        }


        /* =========================
           QUAY ĐÚNG TÊN ĐƯỢC CHỌN
        ========================= */

        function spinWheel() {

            if (spinning) return;

            spinning = true;
            spinBtn.disabled = true;
            result.textContent = "";

            // Chọn người thắng
            const winner = Math.floor(Math.random() * items.length);

            // Góc chính giữa ô người thắng
            const winnerMiddleAngle =
                winner * sliceAngle + sliceAngle / 2;

            // Mũi tên nằm phía trên
            const pointerAngle = -Math.PI / 2;

            /*
                Góc cuối cần đạt để người thắng
                nằm chính xác dưới mũi tên
            */
            const finalAngle =
                pointerAngle - winnerMiddleAngle;

            /*
                Chuẩn hóa góc hiện tại
                để tránh số góc quá lớn sau nhiều lần quay
            */
            const normalizedCurrent =
                currentRotation % (Math.PI * 2);

            /*
                Khoảng cách từ vị trí hiện tại
                đến vị trí người thắng
            */
            let difference =
                finalAngle - normalizedCurrent;

            if (difference < 0) {
                difference += Math.PI * 2;
            }

            /*
                Luôn thêm 6 vòng quay
                => tốc độ các lần quay ổn định
            */
            const extraSpins = 6 * Math.PI * 2;

            const startRotation = currentRotation;

            const targetRotation =
                currentRotation +
                extraSpins +
                difference;

            // Luôn mất đúng 3 giây
            const duration = 3000;

            const startTime = performance.now();


            function animate(currentTime) {

                const elapsed =
                    currentTime - startTime;

                let progress =
                    elapsed / duration;

                if (progress > 1) {
                    progress = 1;
                }

                /*
                    Ease out:
                    đầu quay nhanh
                    cuối chậm lại
                */
                const easeOut =
                    1 - Math.pow(1 - progress, 4);

                currentRotation =
                    startRotation +
                    (targetRotation - startRotation) *
                    easeOut;


                /*
                    Vẽ vòng quay
                */
                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                ctx.save();

                ctx.translate(center, center);
                ctx.rotate(currentRotation);
                ctx.translate(-center, -center);

                drawWheel();

                ctx.restore();


                if (progress < 1) {

                    requestAnimationFrame(animate);

                } else {

                    // Đảm bảo góc cuối chính xác tuyệt đối
                    currentRotation = targetRotation;

                    spinning = false;
                    spinBtn.disabled = false;

                }
            }

            requestAnimationFrame(animate);
        }


        /* =========================
           KHỞI TẠO
        ========================= */

        drawWheel();

        spinBtn.addEventListener(
            "click",
            spinWheel
        );
    </script>

</body>

</html>
