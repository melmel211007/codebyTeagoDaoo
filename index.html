<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vòng Quay Phát Biểu</title>

    <style>
        
    </style>
</head>

<body>

    <h1> Vòng Quay Phát Biểu Bài Tiếng Anh</h1>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="500" height="500"></canvas>
    </div>

    <button id="spinBtn">QUAY!</button>

    <div id="result"></div>

    <script>
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spinBtn");
        const result = document.getElementById("result");

        const items = [
            "Nguyễn Ngọc Tâm Anh",
            "Trương Ngọc Ánh",
            "Phùng Minh Diệp",
            "Vũ Thùy Dương",
            "Đặng Cao Hiếu",
            "Nguyễn Thị Mỹ Hạnh",
            "Phạm Thị Thu Hiền",
            "Lê Thị Hoài",
            "Nguyễn Mạnh Hoàng",
            "Chu Khắc Khiêm",
            "Phạm Văn Khoa",
            "Nguyễn Văn Lâm",
            "Hoàng Hà Linh",
            "Vũ Bảo Linh",
            "Bùi Mai Linh",
            "Nguyễn Thùy Linh",
            "Nguyễn Khánh Linh",
            "Võ Thị Lưu",
            "Lê Thị Cẩm Ly",
            "Mai Khánh Ly",
            "Lê Thị Phương Mai",
            "Đỗ Tuệ Minh",
            "Vũ Trà My",
            "Lại Thị Hà My",
            "Đồng Thị Thanh Ngân",
            "Bùi Thảo Nguyên",
            "Lê Thị Phương",
            "Nguyễn Thị Như Quỳnh",
            "Phan Hoàng Bảo Sơn",
            "Vũ Thị Kiều Thanh",
            "Bùi Thị Anh Thơ",
            "Nguyễn Thanh Thúy",
            "Phạm Thùy Trang",
            "Nguyễn Thu Trang",
            "Lê Phan Hà Trang",
            "Lê Bảo Trân",
            "Phùng Hải Yến",
            "Nguyễn Minh Tuệ",
            "Dương Thị Hải Yến"
        ];

        const colors = [
            "#ff9fbc",
            "#c7a4ff",
            "#ffd28f",
            "#9de2d0",
            "#9ed8ff",
            "#ffb3c6",
            "#b9a7ff",
            "#ffe29a"
        ];

        const center = canvas.width / 2;
        const radius = canvas.width / 2;

        let currentRotation = 0;
        let spinning = false;

        const sliceAngle = (Math.PI * 2) / items.length;


        /* =========================
           VẼ VÒNG QUAY
        ========================= */

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            items.forEach((item, index) => {

                const startAngle = index * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Ô màu
                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(
                    center,
                    center,
                    radius,
                    startAngle,
                    endAngle
                );
                ctx.closePath();

                ctx.fillStyle = colors[index % colors.length];
                ctx.fill();

                // Viền
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.stroke();


                /* =========================
                   TÊN NGƯỜI
                ========================= */

                const middleAngle = startAngle + sliceAngle / 2;

                ctx.save();

                ctx.translate(center, center);
                ctx.rotate(middleAngle);

                ctx.textAlign = "right";
                ctx.textBaseline = "middle";

                // 41 người nên chữ phải nhỏ
                let fontSize = 18;

                if (items.length > 35) {
                    fontSize = 15;
                }

                if (items.length > 40) {
                    fontSize = 13;
                }

                ctx.font = `bold ${fontSize}px Arial`;
                ctx.fillStyle = "#ffffff";

                // Có bóng chữ để dễ đọc
                ctx.shadowColor = "rgba(80,40,80,0.35)";
                ctx.shadowBlur = 3;

                ctx.fillText(
                    item,
                    radius - 18,
                    0
                );

                ctx.restore();
            });

            // Tâm vòng quay
            ctx.beginPath();
            ctx.arc(center, center, 28, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(center, center, 20, 0, Math.PI * 2);
            ctx.fillStyle = "#ffe5ec";
            ctx.fill();
        }


        /* =========================
           QUAY ĐÚNG TÊN ĐƯỢC CHỌN
        ========================= */

        function spinWheel() {

            if (spinning) return;

            spinning = true;
            spinBtn.disabled = true;
            result.textContent = "";

            // Chọn người thắng
            const winner = Math.floor(Math.random() * items.length);

            // Góc chính giữa ô người thắng
            const winnerMiddleAngle =
                winner * sliceAngle + sliceAngle / 2;

            // Mũi tên nằm phía trên
            const pointerAngle = -Math.PI / 2;

            /*
                Góc cuối cần đạt để người thắng
                nằm chính xác dưới mũi tên
            */
            const finalAngle =
                pointerAngle - winnerMiddleAngle;

            /*
                Chuẩn hóa góc hiện tại
                để tránh số góc quá lớn sau nhiều lần quay
            */
            const normalizedCurrent =
                currentRotation % (Math.PI * 2);

            /*
                Khoảng cách từ vị trí hiện tại
                đến vị trí người thắng
            */
            let difference =
                finalAngle - normalizedCurrent;

            if (difference < 0) {
                difference += Math.PI * 2;
            }

            /*
                Luôn thêm 6 vòng quay
                => tốc độ các lần quay ổn định
            */
            const extraSpins = 6 * Math.PI * 2;

            const startRotation = currentRotation;

            const targetRotation =
                currentRotation +
                extraSpins +
                difference;

            // Luôn mất đúng 3 giây
            const duration = 3000;

            const startTime = performance.now();


            function animate(currentTime) {

                const elapsed =
                    currentTime - startTime;

                let progress =
                    elapsed / duration;

                if (progress > 1) {
                    progress = 1;
                }

                /*
                    Ease out:
                    đầu quay nhanh
                    cuối chậm lại
                */
                const easeOut =
                    1 - Math.pow(1 - progress, 4);

                currentRotation =
                    startRotation +
                    (targetRotation - startRotation) *
                    easeOut;


                /*
                    Vẽ vòng quay
                */
                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                ctx.save();

                ctx.translate(center, center);
                ctx.rotate(currentRotation);
                ctx.translate(-center, -center);

                drawWheel();

                ctx.restore();


                if (progress < 1) {

                    requestAnimationFrame(animate);

                } else {

                    // Đảm bảo góc cuối chính xác tuyệt đối
                    currentRotation = targetRotation;

                    spinning = false;
                    spinBtn.disabled = false;

                }
            }

            requestAnimationFrame(animate);
        }


        /* =========================
           KHỞI TẠO
        ========================= */

        drawWheel();

        spinBtn.addEventListener(
            "click",
            spinWheel
        );
    </script>

</body>

</html>
